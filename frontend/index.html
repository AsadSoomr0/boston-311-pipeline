<!DOCTYPE html>
<html>
<head>
  <title>Boston 311 Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, sans-serif;
      color: #1a1a1a;
    }
    #map { height: 100vh; width: 100vw; }
    #app-header {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(6px);
      padding: 18px 26px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    #app-header h1 {
      margin: 0;
      padding-bottom: 2px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.01em;
      border-bottom: 3px solid #2563eb;
      display: inline-block;
  }
    #app-header p {
      margin: 4px 0 0;
      font-size: 16px;
      color: #666;
    }
    /* ---- Sidebar ---- */
    #sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: 300px;
      height: 100vh;
      background: #fafafa;
      padding: 20px;
      box-shadow: -4px 0 16px rgba(0,0,0,0.08);
      overflow-y: auto;
      z-index: 1000;
    }

    #sidebar h3 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #666;
      margin: 24px 0 12px;
    }

    /* ---- Tabs ---- */
    #tabs {
      display: flex;
      gap: 4px;
      background: #eee;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 8px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      color: #555;
    }
    .tab-btn.active {
      background: #1a1a1a;
      color: white;
    }

    /* ---- Checkboxes / radios ---- */
    #category-filters label,
    #rt-category-filters label,
    #status-filter label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      padding: 6px 0;
      cursor: pointer;
      color: #333;
    }
    #category-filters input,
    #rt-category-filters input,
    #status-filter input {
      width: 16px;
      height: 16px;
      accent-color: #1a1a1a;
      cursor: pointer;
    }

    #legend {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 1000;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(6px);
      padding: 12px 14px;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      font-size: 12px;
    }
    #legend .legend-title {
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }
    #legend .legend-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 2px 0;
    }
    #legend .legend-swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* ---- Leaflet overrides ---- */
    .leaflet-top.leaflet-left {
      top: 120px;
      left: 9px;
    }
    .leaflet-interactive:focus {
      outline: none;
    }
    .leaflet-marker-icon, .leaflet-interactive {
      transition: opacity 0.15s ease-in-out;
    }
    .leaflet-popup-content-wrapper {
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .leaflet-popup-content {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      line-height: 1.5;
      margin: 12px 14px;
    }
    .leaflet-tooltip {
      border-radius: 6px;
      border: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      padding: 6px 10px;
    }

  </style>
</head>
<body>
  <div id="app-header">
    <h1>Boston 311</h1>
    <p>Service request trends by neighborhood</p>
  </div>

  <div id="map"></div>

  <div id="legend"></div>

  <div id="sidebar">
    <div id="tabs">
      <button class="tab-btn active" data-tab="cases-panel">Cases</button>
      <button class="tab-btn" data-tab="response-time-panel">Response Time</button>
    </div>

    <div id="cases-panel" class="tab-panel">
      <h3>Category</h3>
      <div id="category-filters">
        <label><input type="checkbox" value="Animals" class="category-cb"> Animals</label>
        <label><input type="checkbox" value="Trash & Sanitation" class="category-cb"> Trash & Sanitation</label>
        <label><input type="checkbox" value="Street Infrastructure" class="category-cb"> Street Infrastructure</label>
        <label><input type="checkbox" value="Parks & Trees" class="category-cb"> Parks & Trees</label>
        <label><input type="checkbox" value="Permits & Signage" class="category-cb"> Permits & Signage</label>
        <label><input type="checkbox" value="Other" class="category-cb"> Other</label>
      </div>

      <h3>Status</h3>
      <div id="status-filter">
        <label><input type="radio" name="status" value="" checked> All</label>
        <label><input type="radio" name="status" value="open"> Open</label>
        <label><input type="radio" name="status" value="closed"> Closed</label>
      </div>
    </div>


    <div id="response-time-panel" class="tab-panel" style="display: none;">
      <h3>Category</h3>
      <div id="rt-category-filters">
        <label><input type="checkbox" value="Animals" class="rt-category-cb"> Animals</label>
        <label><input type="checkbox" value="Trash & Sanitation" class="rt-category-cb"> Trash & Sanitation</label>
        <label><input type="checkbox" value="Street Infrastructure" class="rt-category-cb"> Street Infrastructure</label>
        <label><input type="checkbox" value="Parks & Trees" class="rt-category-cb"> Parks & Trees</label>
        <label><input type="checkbox" value="Permits & Signage" class="rt-category-cb"> Permits & Signage</label>
        <label><input type="checkbox" value="Other" class="rt-category-cb"> Other</label>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
