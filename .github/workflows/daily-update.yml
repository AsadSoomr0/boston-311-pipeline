name: Update data and deploy

on:
  schedule:
    - cron: "0 8 * * *"   # daily, ~4am Boston time
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = last 60 days, full = everything since DATA_START, build = no ingest"
        type: choice
        options: [daily, full, build]
        default: daily
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "pipeline/**"
      - ".github/workflows/daily-update.yml"

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ingest and build site data
        run: |
          MODE="${{ github.event.inputs.mode || 'daily' }}"
          if [ "${{ github.event_name }}" = "push" ]; then MODE=build; fi
          case "$MODE" in
            full)  python -m pipeline.run --full ;;
            build) python -m pipeline.run --skip-ingest ;;
            *)     python -m pipeline.run ;;
          esac

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli deploy --prod --dir=frontend --message "Data update ${{ github.run_id }}"
