name: Daily 311 Data Update

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas psycopg2-binary sqlalchemy requests
      - run: python scripts/daily_update.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}